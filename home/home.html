<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThingS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="../user.css" rel="stylesheet">
    <link href="home.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div id="titleApp" class="bg-dark text-whitepy-3">
        <h1>ThingS</h1>
    </div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <h2 id="currentUserName"></h2>
            <div class="menu">
                <button id="categories-btn" class="btn btn-secondary me-2">
                    <i class="bi bi-pencil-square"></i> Categories
                </button>
                <button id="users-btn" class="btn btn-secondary me-2">
                    <i class="bi bi-people"></i> Users
                </button>
            </div>
        </div>
        <ul id="todo-list" class="list-group list-group-custom">
            <!-- Items will be dynamically added here -->
        </ul>
        <button id="create-new" class="btn btn-success position-fixed bottom-0 end-0 m-4 rounded-circle p-4" style="width: 70px; height: 70px; background-color: #2f2f2f; color: white;">
            +
        </button>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="item-image" class="form-label">Image</label>
                        <input type="file" class="form-control" id="item-image">
                    </div>
                    <div class="mb-3">
                        <label for="item-title" class="form-label">Title *</label>
                        <input type="text" class="form-control" id="item-title" required>
                    </div>
                    <div class="mb-3">
                        <label for="item-description" class="form-label">Description *</label>
                        <textarea class="form-control" id="item-description" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="item-category" class="form-label">Category</label>
                        <select class="form-select" id="item-category">
                            <option value="">No Category</option>
                            <option value="Animes">Animes</option>
                            <option value="Books">Books</option>
                            <option value="Collectibles">Collectibles</option>
                            <option value="Games">Games</option>
                            <option value="Movies">Movies</option>
                            <option value="Notes">Notes</option>
                            <option value="Series">Series</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Back</button>
                    <button type="button" class="btn btn-primary" id="save-btn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">Confirm deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Yes, delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">Cover</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modal-image" class="img-fluid" alt="Original Cover">
                </div>
            </div>
        </div>
    </div>

    <!-- Categories Modal -->
    <div class="modal fade" id="categoriesModal" tabindex="-1" aria-labelledby="categoriesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoriesModalLabel">Manage Categories</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- List of categories -->
                    <ul id="categoriesList" class="list-group mb-3">
                        <!-- Categories will be dynamically added here -->
                    </ul>
                    <!-- Input to add a new category -->
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="newCategoryInput" placeholder="New category name">
                        <button class="btn btn-success" type="button" onclick="addCategory()">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Users Modal -->
    <div class="modal fade" id="usersModal" tabindex="-1" aria-labelledby="usersModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="usersModalLabel">Users List</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul id="usersList" class="list-group">
                        <!-- Users will be dynamically added here -->
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
<div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="chatModalLabel">Messages</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <ul id="messageList" class="list-group">
                <!-- Messages will be dynamically added here -->
            </ul>
            <div class="mt-3">
                <textarea id="newMessage" class="form-control" rows="3" placeholder="Add your message" required></textarea>
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="addMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

    <div id="userProfile" class="user-profile">
        <img id="userPhoto" class="user-photo" alt="User Photo">
        <span id="userName" class="user-name"></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
